# APIShield Developer Console — nginx-hosted React SPA.
#
# The built assets are static, so this pod only needs the nginx server.
# Scaled to 2 replicas for redundancy (nginx is stateless).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: apishield
  labels:
    app: apishield-frontend
    app.kubernetes.io/part-of: apishield
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apishield-frontend
  template:
    metadata:
      labels:
        app: apishield-frontend
    spec:
      containers:
        - name: frontend
          image: apishield-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: apishield
  labels:
    app: apishield-frontend
    app.kubernetes.io/part-of: apishield
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: apishield-frontend
