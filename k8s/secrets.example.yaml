# ⚠️  DEMO SECRETS — DO NOT USE IN PRODUCTION  ⚠️
#
# This file ships with real, working development credentials so the stack works
# out of the box. They are base64-encoded Kubernetes Secret data values.
#
# Before any production deployment, regenerate every value:
#
#   ./k8s/generate-secrets.sh        # writes a fresh k8s/secrets.yaml (gitignored)
#
# or by hand:
#
#   echo -n 'your-password' | base64
#
# The RSA key pair below is shared by the gateway's encrypting agents
# (security-agent / multi-agent-orchestrator) so a threat event encrypted by one
# pod can be decrypted by the other. If each pod generates its own pair, cross-
# pod decryption silently breaks — keep these two values in sync across pods.
apiVersion: v1
kind: Secret
metadata:
  name: apishield-secrets
  namespace: apishield
  labels:
    app.kubernetes.io/part-of: apishield
type: Opaque
data:
  # --- Postgres (n8n database) ---
  POSTGRES_USER: "bjhuX3VzZXI="                                 # n8n_user
  POSTGRES_PASSWORD: "YzBlYTA4OGZjMTVkYjAzNzlmYWVkNGVkMWJmNmExZTYwNzVkM2ViODE2YTYzZGI4"   # DEMO ONLY
  POSTGRES_DB: "bjhuX2Ri"                                       # n8n_db

  # --- Redis (rate limiting / telemetry / threat queue) ---
  REDIS_PASSWORD: "Y2Y2ODIyOTBlYzJkNzlhNTJhM2RiNTcwY2U1YTM2NjE5ZGNiYWExYWFiY2FkNzhj"      # DEMO ONLY

  # --- Hybrid AES-RSA payload encryption (must match across all gateway pods) ---
  ENCRYPTION_RSA_PRIVATE_KEY: ""
  ENCRYPTION_RSA_PUBLIC_KEY: ""

  # --- Optional: Google Gemini API key for the AI-powered admin chat ---
  # Uncomment and set to a real key to enable full AI capabilities in /admin/chat.
  # Without it the gateway falls back to its deterministic sandbox NLP mode.
  # GEMINI_API_KEY: "UkVQTEFDRV9XSVRIX1lPVVJfUkVBTF9LRVk="   # "REPLACE_WITH_YOUR_REAL_KEY"
