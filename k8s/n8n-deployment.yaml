# n8n workflow automation engine — production-hardened deployment.
#
# - PostgreSQL-backed (credentials injected from the apishield-secrets Secret)
# - /healthz probe (n8n's built-in health endpoint)
# - PVC-backed persistence for workflow definitions & keys
# - ClusterIP service exposed via k8s/ingress.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: apishield
  labels:
    app: apishield-n8n
    app.kubernetes.io/part-of: apishield
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: apishield
  labels:
    app: apishield-n8n
    app.kubernetes.io/part-of: apishield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apishield-n8n
  template:
    metadata:
      labels:
        app: apishield-n8n
    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 5678
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: apishield-secrets
                  key: POSTGRES_DB
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: apishield-secrets
                  key: POSTGRES_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apishield-secrets
                  key: POSTGRES_PASSWORD
            - name: N8N_BASIC_AUTH_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: apishield-config
                  key: N8N_BASIC_AUTH_ACTIVE
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: web
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: web
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-storage
          persistentVolumeClaim:
            claimName: n8n-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: apishield
  labels:
    app: apishield-n8n
    app.kubernetes.io/part-of: apishield
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 5678
      targetPort: 5678
  selector:
    app: apishield-n8n
